<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script type="module" src="/assets/packages/model_viewer_plus/assets/model-viewer.min.js"></script>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      touch-action: none;
    }
    model-viewer {
      width: 100%;
      height: 100%;
      background-color: transparent;
      --poster-color: transparent;
      pointer-events: none;
      touch-action: none;
    }
  </style>
</head>
<body>
  <model-viewer
    id="milo"
    alt="Milo companion model"
    autoplay
    animation-name="idle"
    animation-crossfade-duration="320"
    shadow-intensity="1"
    shadow-softness="0.8"
    exposure="1"
    environment-image="neutral"
    interaction-prompt="none"
    disable-zoom
    disable-pan
    disable-tap
    touch-action="none"
    loading="eager">
  </model-viewer>
  <script>
    const mv = document.getElementById('milo');
    const params = new URLSearchParams(window.location.search);
    const character = params.get('character');
    const scale = params.get('scale');
    const orbit = params.get('orbit') || '0deg 78deg auto';
    const target = params.get('target') || 'auto auto auto';
    const fov = params.get('fov') || 'auto';
    mv.setAttribute('camera-orbit', orbit);
    mv.setAttribute('camera-target', target);
    mv.setAttribute('field-of-view', fov);
    mv.src = character === 'suzu'
      ? '/assets/assets/grab3d-cozy-character-girl.glb'
      : '/assets/assets/grab3d-cozy-character.glb';
    if (scale) mv.setAttribute('scale', scale);
    const looping = ['idle', 'listen', 'talk', 'dance'];
    const face = { mouth:0, mouthT:0, smile:0, smileT:0, blink:0, blinkT:0,
      speaking:false, lastWordAt:0, nextExprAt:0, nextBlinkAt:0 };
    let meshes = [];
    let mouthMesh = null;
    let mouthBase = null;

    function collect(root) {
      if (!root) return;
      const stack = [root];
      while (stack.length) {
        const obj = stack.pop();
        if (obj && obj.morphTargetInfluences && obj.morphTargetInfluences.length) {
          meshes.push(obj);
        }
        if (obj && obj.isMesh && obj.material) {
          const materials = Array.isArray(obj.material) ? obj.material : [obj.material];
          if (materials.some((material) => material && material.name === 'fix_mouth')) {
            const geometry = obj.geometry;
            if (geometry && !geometry.boundingBox && geometry.computeBoundingBox) {
              geometry.computeBoundingBox();
            }
            const bounds = geometry && geometry.boundingBox;
            mouthMesh = obj;
            mouthBase = {
              scaleY:obj.scale.y,
              positionY:obj.position.y,
              centerY:bounds ? (bounds.min.y + bounds.max.y) / 2 : 0
            };
          }
        }
        const kids = (obj && obj.children) || [];
        for (let i = 0; i < kids.length; i++) stack.push(kids[i]);
      }
    }
    function findScene(el) {
      const seen = [];
      const visit = function(obj, depth) {
        if (!obj || depth > 5) return null;
        for (let i = 0; i < seen.length; i++) if (seen[i] === obj) return null;
        seen.push(obj);
        if (obj.isScene) return obj;
        if (obj.scene && obj.scene.isScene) return obj.scene;
        try {
          const syms = Object.getOwnPropertySymbols(obj);
          for (let i = 0; i < syms.length; i++) {
            const found = visit(obj[syms[i]], depth + 1);
            if (found) return found;
          }
        } catch (e) {}
        return null;
      };
      return visit(el, 0);
    }
    const motion = {
      root:null, base:null, name:'idle', startedAt:0, procedural:false
    };
    function bindMotion() {
      const scene = findScene(mv);
      if (!scene) return;
      const hasMesh = (root) => {
        const stack = [root];
        while (stack.length) {
          const obj = stack.pop();
          if (obj && obj.isMesh) return true;
          const kids = (obj && obj.children) || [];
          for (let i = 0; i < kids.length; i++) stack.push(kids[i]);
        }
        return false;
      };
      const root = (scene.children || []).find(hasMesh) || scene;
      motion.root = root;
      motion.base = {
        x:root.position.x, y:root.position.y, z:root.position.z,
        rx:root.rotation.x, ry:root.rotation.y, rz:root.rotation.z
      };
    }
    function resetMotion() {
      if (!motion.root || !motion.base) return;
      const {root, base} = motion;
      root.position.set(base.x, base.y, base.z);
      root.rotation.set(base.rx, base.ry, base.rz);
    }
    function viseme(word) {
      const w = String(word || '').toLowerCase().replace(/[^a-z]/g, '');
      if (!w) return 0.08;
      if (/^[mbp]/.test(w)) return 0.05;
      if (/^[fv]/.test(w)) return 0.16;
      if (/o/.test(w)) return 0.62;
      if (/[au]/.test(w)) return 0.52;
      if (/[ei]/.test(w)) return 0.34;
      if (/[aeiou]/.test(w)) return 0.4;
      return 0.14;
    }
    function applyFace() {
      for (let i = 0; i < meshes.length; i++) {
        const inf = meshes[i].morphTargetInfluences;
        if (!inf) continue;
        const d = meshes[i].morphTargetDictionary || {};
        if ('open' in d) inf[d.open] = face.mouth;
        if ('smile' in d) inf[d.smile] = face.smile;
        if ('blink' in d) inf[d.blink] = face.blink;
        if (!('open' in d) && !('blink' in d)) {
          if (inf.length >= 2) { inf[0] = face.mouth; inf[1] = face.smile; }
          else inf[0] = Math.max(face.mouth, face.blink);
        }
      }
      if (mouthMesh && mouthBase) {
        const verticalScale = mouthBase.scaleY *
          (1 + Math.max(0, face.mouth) * 3.4);
        mouthMesh.scale.y = verticalScale;
        mouthMesh.position.y = mouthBase.positionY +
          mouthBase.centerY * (1 - verticalScale / mouthBase.scaleY);
      }
    }
    function bind() {
      meshes = [];
      const scene = findScene(mv);
      if (scene) collect(scene);
    }
    function playClip(name) {
      const clips = mv.availableAnimations || [];
      motion.name = name;
      motion.startedAt = performance.now();
      if (!motion.root) bindMotion();
      motion.procedural = clips.indexOf(name) < 0;
      if (motion.procedural) {
        resetMotion();
        mv.animationName = 'idle';
        mv.play();
        return;
      }
      resetMotion();
      const clip = name;
      try { mv.animationCrossfadeDuration = 320; } catch (e) {}
      if (mv.animationName === clip) {
        try { mv.currentTime = 0; } catch (e) {}
      }
      mv.animationName = clip;
      try {
        if (looping.indexOf(clip) >= 0) mv.play();
        else mv.play({repetitions: 1});
      } catch (e) {
        if (mv.play) mv.play();
      }
    }
    function setSpeaking(on) {
      face.speaking = !!on;
      const now = performance.now();
      if (!on) {
        face.mouthT = 0; face.smileT = 0; face.blinkT = 0;
        return;
      }
      if (!meshes.length) bind();
      face.smileT = 0.16;
      face.nextExprAt = now + 800;
      face.nextBlinkAt = now + 600;
    }
    window.addEventListener('message', (event) => {
      const data = event.data;
      if (typeof data !== 'string') return;
      if (data.startsWith('anim:')) playClip(data.slice(5));
      if (data.startsWith('camera:')) {
        const [orbit, target, fov] = data.slice(7).split('|');
        if (orbit) mv.cameraOrbit = orbit;
        if (target) mv.cameraTarget = target;
        if (fov) mv.fieldOfView = fov;
      }
      if (data.startsWith('scale:')) {
        mv.setAttribute('scale', data.slice(6));
      }
      if (data === 'speak:on') setSpeaking(true);
      if (data === 'speak:off') setSpeaking(false);
      if (data.startsWith('word:')) {
        const word = data.slice(5);
        face.mouthT = viseme(word);
        face.lastWordAt = performance.now();
        if (/hi|hey|yay|happy|love|hehe|wow|thanks/.test(word.toLowerCase())) {
          face.smileT = Math.min(0.72, Math.max(face.smileT, 0.4));
        }
      }
    });
    mv.addEventListener('load', () => {
      bind();
      bindMotion();
      parent.postMessage('milo-ready', '*');
    });
    mv.addEventListener('error', (event) => {
      const detail = event && event.detail ? String(event.detail) : 'GLB load failed';
      parent.postMessage(`milo-error:${detail}`, '*');
    });
    (function loop(now) {
      requestAnimationFrame(loop);
      const root = motion.root;
      const base = motion.base;
      if (root && base && motion.procedural &&
          ['listen','talk','dance','spin','think'].indexOf(motion.name) >= 0) {
        const t = (now - motion.startedAt) / 1000;
        if (motion.name === 'dance') {
          root.position.y = base.y + Math.abs(Math.sin(t * 5.5)) * 0.065;
          root.rotation.x = base.rx + Math.sin(t * 5.5) * 0.035;
          root.rotation.y = base.ry + Math.sin(t * 2) * 0.1;
          root.rotation.z = base.rz + Math.sin(t * 2.7) * 0.12;
        } else if (motion.name === 'spin') {
          const progress = Math.min(1, t / 1.45);
          root.rotation.y = base.ry + progress * Math.PI * 2;
          root.position.y = base.y + Math.sin(progress * Math.PI) * 0.04;
        } else if (motion.name === 'talk') {
          root.position.y = base.y + Math.sin(t * 7) * 0.012;
          root.rotation.x = base.rx + Math.sin(t * 3.5) * 0.018;
        } else if (motion.name === 'think') {
          root.position.y = base.y + Math.sin(t * 1.4) * 0.006;
          root.rotation.x = base.rx - 0.055 + Math.sin(t * 1.1) * 0.012;
          root.rotation.z = base.rz + 0.065;
        } else {
          root.position.y = base.y + Math.sin(t * 2.2) * 0.008;
          root.rotation.x = base.rx + Math.sin(t * 2.2) * 0.035;
        }
      }
      if (face.speaking) {
        if (now - face.lastWordAt > 260) face.mouthT = 0.09;
        if (now > face.nextExprAt) {
          const pick = Math.random();
          if (pick < 0.34) face.smileT = 0.22;
          else if (pick < 0.62) face.smileT = 0.5;
          else if (pick < 0.82) face.smileT = 0.08;
          else face.smileT = 0.64;
          face.nextExprAt = now + 1100 + Math.random() * 1500;
        }
        if (now > face.nextBlinkAt) {
          face.blinkT = 1;
          face.nextBlinkAt = now + 1800 + Math.random() * 2200;
          setTimeout(function() { face.blinkT = 0; }, 140);
        }
      }
      const ease = face.speaking ? 0.07 : 0.05;
      face.mouth += (face.mouthT - face.mouth) * ease;
      face.smile += (face.smileT - face.smile) * 0.045;
      face.blink += (face.blinkT - face.blink) * 0.28;
      applyFace();
    })(0);
  </script>
</body>
</html>
